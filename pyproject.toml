[project]
name = "netcat"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "gunicorn>=26.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes errors, I: import order, UP: modern syntax, B: likely bugs
select = ["E", "F", "I", "UP", "B"]
