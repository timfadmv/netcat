name: Pipeline (SAST > SCA > DAST)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Runners are pinned to ubuntu-24.04: `ubuntu-latest` moves to a newer Ubuntu (and Python)
# on its own schedule, which would change the environment without a commit here.
jobs:
  tests:
    name: Tests - pytest and ruff
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same uv and Python versions as the dockerfile, so the tests run on what is shipped.
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.14"
          enable-cache: false

      - name: Install the locked dependencies
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run --frozen ruff check .

      - name: Run the tests
        run: uv run --frozen pytest

  secrets:
    name: Secrets - Gitleaks
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan every commit, not only the latest one
          persist-credentials: false

      # Same gitleaks version as the pre-commit hook, pinned by digest.
      # Fails the job (exit code 1) when a secret is found in any commit.
      - name: Scan the git history for secrets
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --verbose

  sast:
    name: SAST - Semgrep Scan
    if: (github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep scan
        run: |
          pip install --require-hashes --no-deps -r ci/requirements-semgrep.txt
          semgrep ci --config=p/security-audit --config=p/owasp-top-ten --sarif --output=semgrep.sarif
        env:
          SEMGREP_DISABLE_VERSION_CHECK: 'true'

      - name: Upload SARIF results to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
          wait-for-processing: true

      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const semgrepOutput = fs.existsSync('semgrep.sarif')
              ? JSON.parse(fs.readFileSync('semgrep.sarif', 'utf8'))
              : { runs: [] };

            const results = semgrepOutput.runs[0]?.results || [];
            if (results.length === 0) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '✅ Semgrep scan passed with no findings!'
              });
            }

  sca:
    name: SCA - Trivy Image Scan
    runs-on: ubuntu-24.04
    needs: sast
    if: always() # will run even if sast found problems (not just when it succeeds)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build an image from Dockerfile
        run: docker build -t netcat/netcat:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.75.0' # Trivy itself; the action defaults to an older release
          image-ref: 'netcat/netcat:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  dast:
    name: DAST - ZAP Scan
    runs-on: ubuntu-24.04
    needs: sca
    if: always() # will run even if SCA detects a CRITICAL/HIGH issue (the job will fail due to an exit code of '1')
    timeout-minutes: 15

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start app with docker compose
        run: docker compose up -d --build

      - name: Wait for app to be ready
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:5000; do
            echo "waiting for app..."
            sleep 2
          done'

      - name: Show running containers (debug)
        if: always()
        run: docker ps -a

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:5000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef'
          fail_action: false

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-report
          path: report_html.html
          retention-days: 30

      - name: Show app logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v