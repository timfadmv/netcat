name: Pipeline (SAST > SCA > DAST)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  sast:
    name: SAST - Semgrep Scan
    if: (github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Run Semgrep scan
        run: |
          pip install semgrep
          semgrep ci --config=p/security-audit --config=p/owasp-top-ten --sarif --output=semgrep.sarif
        continue-on-error: true
        env:
          SEMGREP_DISABLE_VERSION_CHECK: 'true'

      # - name: Upload SARIF results to GitHub Security
      #   uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a
      #   if: always()
      #   with:
      #     sarif_file: semgrep.sarif
      #     category: semgrep
      #     wait-for-processing: true

      - name: Build Semgrep summary
        if: always()
        run: |
          cat > semgrep_summary.py << 'PYEOF'
          import json
          import os

          def build_summary():
              path = "semgrep.sarif"
              lines = ["## Semgrep SAST results\n"]

              if not os.path.exists(path):
                  lines.append("The report was not generated (semgrep.sarif not found)")
                  return lines

              data = json.load(open(path))
              results = (data.get("runs") or [{}])[0].get("results", [])
              if not results:
                  lines.append("No issues found")
              else:
                  lines.append(f"**{len(results)}** issues found:\n")
                  for r in results[:20]:
                      msg = r.get("message", {}).get("text", "")
                      loc = r["locations"][0]["physicalLocation"]
                      file_ = loc["artifactLocation"]["uri"]
                      line_no = loc["region"]["startLine"]
                      rule = r.get("ruleId", "unknown")
                      lines.append(f"- **{file_}:{line_no}** [`{rule}`] - {msg}")
                  if len(results) > 20:
                      lines.append(f"\n... and also{len(results) - 20}, see the tab Security")
              return lines

          try:
              lines = build_summary()
          except Exception as e:
              lines = ["## Semgrep SAST results\n", f"Unable to parse the report: {e}"]

          with open("semgrep-summary.md", "w") as out:
              out.write(chr(10).join(lines))
          PYEOF
          python3 semgrep_summary.py

      - name: Comment on PR with results
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0
        with:
          header: semgrep
          path: semgrep-summary.md

  sca:
    name: SCA - Trivy Image Scan
    runs-on: ubuntu-24.04
    needs: sast
    if: always() # will run even if sast found problems (not just when it succeeds)

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Build an image from Dockerfile
        run: docker build -t netcat/netcat:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        continue-on-error: true
        with:
          image-ref: 'netcat/netcat:${{ github.sha }}'
          format: 'table'
          output: 'trivy-report.txt'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build Trivy summary
        if: always()
        run: |
          echo "## 📦 Trivy SCA results" > trivy-summary.md
          echo '```' >> trivy-summary.md
          cat trivy-report.txt >> trivy-summary.md 2>/dev/null || echo "Report not found" >> trivy-summary.md
          echo '```' >> trivy-summary.md

      - name: Comment on PR with results
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0
        with:
          header: trivy
          path: trivy-summary.md

      - name: Fail job if vulnerabilities found
        if: steps.trivy.outcome == 'failure'
        run: |
          echo "Trivy discovered CRITICAL/HIGH vulnerabilities—see the comment in the PR"
          exit 1

  dast:
    name: DAST - ZAP Scan
    runs-on: ubuntu-latest
    needs: sca
    if: always() # will run even if SCA detects a CRITICAL/HIGH issue (the job will fail due to an exit code of '1')
    timeout-minutes: 15

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Start app with docker compose
        run: docker compose up -d --build

      - name: Wait for app to be ready
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:5000; do
            echo "Waiting for app..."
            sleep 2
          done'

      - name: Show running containers (debug)
        if: always()
        run: docker ps -a

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: 'http://localhost:5000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          fail_action: false

      - name: Comment on PR with ZAP results
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0
        with:
          header: zap
          path: report_md.md

          
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zap-report
          path: report_html.html
          retention-days: 30

      - name: Show app logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v