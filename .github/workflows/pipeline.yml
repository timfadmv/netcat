name: Pipeline (SAST > SCA > DAST)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  sast:
    name: SAST - Semgrep Scan
    if: (github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Run Semgrep scan
        run: |
          pip install semgrep
          semgrep ci --config=p/security-audit --config=p/owasp-top-ten --sarif --output=semgrep.sarif
        continue-on-error: true
        env:
          SEMGREP_DISABLE_VERSION_CHECK: 'true'

      - name: Upload SARIF results to GitHub Security
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
          wait-for-processing: true

      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const semgrepOutput = fs.existsSync('semgrep.sarif')
              ? JSON.parse(fs.readFileSync('semgrep.sarif', 'utf8'))
              : { runs: [] };

            const results = semgrepOutput.runs[0]?.results || [];
            if (results.length === 0) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '✅ Semgrep scan passed with no findings!'
              });
            }

  sca:
    name: SCA - Trivy Image Scan
    runs-on: ubuntu-24.04
    needs: sast
    if: always() # will run even if sast found problems (not just when it succeeds)

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Build an image from Dockerfile
        run: docker build -t netcat/netcat:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'netcat/netcat:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  dast:
    name: DAST - ZAP Scan
    runs-on: ubuntu-latest
    needs: sca
    if: always() # will run even if SCA detects a CRITICAL/HIGH issue (the job will fail due to an exit code of '1')
    timeout-minutes: 15

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Start app with docker compose
        run: docker compose up -d --build

      - name: Wait for app to be ready
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:5000; do
            echo "waiting for app..."
            sleep 2
          done'

      - name: Show running containers (debug)
        if: always()
        run: docker ps -a

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: 'http://localhost:5000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          fail_action: false

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zap-report
          path: report_html.html
          retention-days: 30

      - name: Show app logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v